---
apiVersion: v1
kind: Namespace
metadata: 
  name: graylog

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: graylog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: graylog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graylog-pvc
  namespace: graylog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: graylog
  namespace: graylog
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: graylog
  namespace: graylog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: graylog
subjects:
- kind: Group
  name: system:serviceaccounts
  apiGroup: rbac.authorization.k8s.io
- kind: ServiceAccount
  name: graylog
  namespace: graylog

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      service: elasticsearch
  template:
    metadata:
      labels:
        service: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        args:
        - "elasticsearch"
        - "-Ecluster.name=graylog"
        volumeMounts:
        - name: elasticsearch-volume
          mountPath: /usr/share/elasticsearch/data
      volumes:
      - name: elasticsearch-volume
        persistentVolumeClaim:
          claimName: elasticsearch-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: graylog
  labels:
    service: elasticsearch
spec:
  clusterIP: None
  ports:
  - name: headless
    port: 9200
    targetPort: 9200
  selector:
    service: elasticsearch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mongo
  template:
    metadata:
      labels:
        service: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        volumeMounts:
        - name: mongodb-volume
          mountPath: /data/db
      volumes:
      - name: mongodb-volume
        persistentVolumeClaim:
          claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: graylog
  labels:
    service: mongo
spec:
  clusterIP: None
  ports:
  - name: headless
    port: 27017
    targetPort: 27017
  selector:
    service: mongo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graylog
  namespace: graylog

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  namespace: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      service: graylog
  template:
    metadata:
      labels:
        service: graylog
    spec:
      serviceAccountName: graylog
      containers:
      - name: graylog
        image: graylog/graylog:5.1
        env:
        - name: GRAYLOG_WEB_ENDPOINT_URI
          value: http://graylog.rancher.hro.dev.br/api
        - name: GRAYLOG_ELASTICSEARCH_HOSTS
          value: "http://elasticsearch.graylog.svc.cluster.local:9200"
        - name: ELASTICSEARCH_DISCOVERY_ZEN_PING_MULTICAST_ENABLED
          value: "false"
        - name: ELASTICSEARCH_DISCOVERY_ZEN_PING_UNICAST_HOSTS
          value: "elasticsearch.graylog.svc.cluster.local:9300"
        ports:
        - containerPort: 9000
        - containerPort: 12201
        volumeMounts:
        - name: graylog-volume
          mountPath: /opt/graylog/data
      volumes:
      - name: graylog-volume
        persistentVolumeClaim:
          claimName: graylog-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: graylog
  namespace: graylog
  labels:
    service: graylog
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: tcp
  - port: 12201
    targetPort: 12201
    protocol: UDP
    name: udp
  selector:
    service: graylog

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graylog
  namespace: graylog
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: graylog.rancher.hro.dev.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graylog
            port:
              number: 9000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: graylog

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
  namespace: graylog
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - endpoints
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
  namespace: graylog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
- kind: ServiceAccount
  name: fluentd
  namespace: graylog

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: graylog
  labels:
    k8s-app: fluentd-logging
    version: v1
    kubernetes.io/cluster-service: "true"
spec:
  selector:
    matchLabels:
      k8s-app: fluentd-logging
      version: v1
  template:
    metadata:
      labels:
        k8s-app: fluentd-logging
        version: v1
        kubernetes.io/cluster-service: "true"
    spec:
      serviceAccountName: fluentd
      containers: 
      - name: fluentd
        image: xbernpa/fluentd-kubernetes-gelf
        imagePullPolicy: Always 
        env:
        - name: GELF_HOST 
          value: "graylog.graylog.svc.cluster.local"
        - name: GELF_PORT
          value: "12201"
        - name: GELF_PROTOCOL
          value: "udp"
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/
          readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/
